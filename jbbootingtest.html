<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JupiterBoot — Booting System</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020202;
    font-family: Arial, Helvetica, sans-serif;
    color: #eee;
}

/* =========================
   SPACE
========================= */

.space {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(
            circle at 20% 45%,
            rgba(130, 72, 30, 0.08),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 50%,
            rgba(180, 100, 40, 0.04),
            transparent 40%
        ),
        #020202;
}

/* Stars */

.stars,
.stars::before,
.stars::after {
    position: absolute;
    inset: 0;
    content: "";
    pointer-events: none;
}

.stars {
    background-image:
        radial-gradient(circle, rgba(255,255,255,.8) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,.45) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,.6) 0 1px, transparent 1.5px);
    background-size:
        173px 211px,
        251px 187px,
        331px 293px;
    background-position:
        20px 40px,
        100px 120px,
        240px 30px;
    opacity: .5;
}

/* =========================
   JUPITER
========================= */

.jupiter {
    position: absolute;

    width: 850px;
    height: 850px;

    right: -330px;
    top: 50%;
    transform: translateY(-50%);

    border-radius: 50%;
    overflow: hidden;

    filter:
        drop-shadow(-35px 0 55px rgba(0,0,0,.95))
        drop-shadow(-5px 0 25px rgba(180,100,40,.15));

    opacity: .98;
}

.jupiter svg {
    width: 100%;
    height: 100%;
    display: block;
}

/* Atmospheric edge */

.jupiter::after {
    content: "";
    position: absolute;
    inset: 0;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 18% 45%,
            transparent 50%,
            rgba(0,0,0,.15) 68%,
            rgba(0,0,0,.75) 100%
        );

    pointer-events: none;
}

/* =========================
   INTERFACE
========================= */

.interface {
    position: absolute;

    left: 7vw;
    top: 9vh;

    width: 390px;

    z-index: 10;
}

/* =========================
   BRAND
========================= */

.brand {
    display: flex;
    align-items: center;
    gap: 20px;
}

.brand-icon {
    position: relative;

    width: 58px;
    height: 58px;

    border: 2px solid #c87335;
    border-radius: 50%;

    transform: rotate(-18deg);

    opacity: .95;
}

.brand-icon::before {
    content: "";

    position: absolute;

    width: 70px;
    height: 22px;

    left: -8px;
    top: 16px;

    border: 2px solid #c87335;
    border-radius: 50%;

    transform: rotate(-15deg);
}

.brand-icon::after {
    content: "";

    position: absolute;

    width: 8px;
    height: 8px;

    right: -3px;
    top: 7px;

    background: #c87335;

    border-radius: 50%;
}

.brand-name {
    font-size: 30px;
    font-weight: 300;
    letter-spacing: 4px;
}

.brand-name span {
    color: #c87335;
}

.device {
    margin-top: 8px;

    font-size: 14px;
    letter-spacing: 4px;

    color: #999;
}

/* =========================
   BOOT STATUS
========================= */

.boot-content {
    margin-top: 180px;
}

.boot-label {
    font-size: 17px;
    letter-spacing: 7px;

    color: #ddd;

    margin-bottom: 18px;
}

.boot-system {
    font-size: 54px;
    font-weight: 300;

    letter-spacing: 14px;

    color: #c87335;

    margin-left: -2px;
}

.starting {
    margin-top: 42px;

    font-size: 20px;
    font-weight: 300;

    letter-spacing: 5px;

    color: #ddd;
}

/* =========================
   LOADING
========================= */

.loader {
    position: relative;

    width: 70px;
    height: 70px;

    margin-top: 48px;
}

.loader::before {
    content: "";

    position: absolute;
    inset: 0;

    border-radius: 50%;

    border: 6px solid rgba(255,255,255,.10);

    transform: rotate(-20deg);
}

.loader::after {
    content: "";

    position: absolute;
    inset: 0;

    border-radius: 50%;

    border: 6px solid transparent;

    border-top-color: #c87335;
    border-right-color: #c87335;

    animation: spin 1.15s linear infinite;
}

@keyframes spin {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

/* =========================
   FOOTER
========================= */

.footer {
    position: absolute;

    left: 7vw;
    bottom: 7vh;

    z-index: 10;

    font-size: 11px;

    letter-spacing: 4px;

    color: #666;
}

.footer span {
    color: #8b542f;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 900px) {

    .interface {
        left: 6vw;
    }

    .jupiter {
        width: 650px;
        height: 650px;

        right: -310px;
    }

    .boot-content {
        margin-top: 130px;
    }
}

@media (max-width: 600px) {

    .interface {
        left: 30px;
        top: 35px;
        width: calc(100% - 60px);
    }

    .brand-name {
        font-size: 23px;
    }

    .brand-icon {
        width: 45px;
        height: 45px;
    }

    .brand-icon::before {
        width: 55px;
        height: 18px;
        top: 12px;
        left: -7px;
    }

    .boot-content {
        margin-top: 120px;
    }

    .boot-label {
        font-size: 13px;
        letter-spacing: 5px;
    }

    .boot-system {
        font-size: 40px;
        letter-spacing: 9px;
    }

    .starting {
        font-size: 15px;
        letter-spacing: 3px;
    }

    .jupiter {
        width: 560px;
        height: 560px;

        right: -340px;
        opacity: .7;
    }

    .footer {
        left: 30px;
        bottom: 30px;
    }
}
</style>

</head>
