<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JupiterBoot</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020202;
    color: #eee;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    position: relative;
    user-select: none;
}

/* =========================
   SPACE
========================= */

.space {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(
            circle at 72% 45%,
            rgba(100, 62, 35, .12),
            transparent 38%
        ),
        #020202;
}

.space::before {
    content: "";
    position: absolute;
    inset: 0;

    background-image:
        radial-gradient(circle, rgba(255,255,255,.75) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.45) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.3) 1px, transparent 1px);

    background-size:
        170px 170px,
        260px 260px,
        390px 390px;

    background-position:
        20px 30px,
        100px 80px,
        200px 150px;

    opacity: .25;
}

/* =========================
   JUPITER
========================= */

.jupiter {
    position: absolute;

    width: 800px;
    height: 800px;

    right: -365px;
    top: 50%;

    transform: translateY(-50%);

    border-radius: 50%;
    overflow: hidden;

    background: #a87555;

    box-shadow:
        -45px 0 90px rgba(214,150,91,.10),
        inset 70px 20px 100px rgba(255,255,255,.10),
        inset -150px -20px 190px rgba(0,0,0,.85);
}

.jupiter svg {
    position: absolute;

    width: 125%;
    height: 125%;

    left: -12%;
    top: -12%;

    transform: rotate(-4deg);

    filter: saturate(.78) contrast(1.04);
}

.jupiter-shade {
    position: absolute;
    inset: 0;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 22% 38%,
            transparent 0%,
            transparent 48%,
            rgba(0,0,0,.10) 62%,
            rgba(0,0,0,.42) 78%,
            rgba(0,0,0,.88) 100%
        );

    pointer-events: none;
}

.jupiter-glow {
    position: absolute;
    inset: -3%;

    border-radius: 50%;

    box-shadow:
        inset 22px 0 40px rgba(255,220,180,.08),
        inset -35px -20px 60px rgba(0,0,0,.55);

    pointer-events: none;
}

/* =========================
   GREAT RED SPOT
========================= */

.red-spot {
    position: absolute;

    width: 155px;
    height: 78px;

    right: 150px;
    top: 55%;

    border-radius: 50%;

    transform: rotate(-8deg);

    background:
        radial-gradient(
            ellipse at 48% 48%,
            #b26045 0%,
            #914735 35%,
            #713528 68%,
            transparent 100%
        );

    box-shadow:
        inset 15px 8px 18px rgba(255,190,140,.12),
        inset -12px -5px 18px rgba(50,15,10,.20);

    opacity: .88;
}

/* =========================
   UI
========================= */

.interface {
    position: absolute;
    z-index: 10;

    left: 7vw;
    top: 9vh;

    width: 370px;
}

/* Logo */

.brand {
    display: flex;
    align-items: center;
    gap: 14px;

    margin-bottom: 5px;
}

.planet-icon {
    width: 38px;
    height: 38px;

    border: 2px solid #bd7946;
    border-radius: 50%;

    position: relative;
}

.planet-icon::after {
    content: "";

    position: absolute;

    width: 43px;
    height: 12px;

    border: 2px solid #bd7946;
    border-radius: 50%;

    left: -5px;
    top: 11px;

    transform: rotate(-18deg);
}

.brand-name {
    font-size: 28px;
    font-weight: 400;
    letter-spacing: -.5px;
}

.brand-name span {
    color: #c47b48;
}

.device {
    margin-left: 52px;

    color: #777;

    font-size: 11px;
    letter-spacing: 2px;

    margin-bottom: 45px;
}

/* =========================
   BUTTONS
========================= */

.menu {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.boot-button {
    position: relative;

    width: 100%;
    height: 48px;

    padding: 0 20px 0 28px;

    display: flex;
    align-items: center;

    border: 1px solid transparent;
    border-left: 2px solid transparent;
    border-radius: 5px;

    background: transparent;

    color: #858585;

    font-family: inherit;
    font-size: 14px;
    letter-spacing: 2px;

    text-align: left;

    cursor: pointer;

    transition:
        color .16s ease,
        background .16s ease,
        border .16s ease,
        transform .12s ease;
}

.boot-button:hover {
    color: #ddd;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.045),
            transparent
        );
}

.boot-button:active {
    transform: translateX(2px);
}

.boot-button.selected {
    color: #fff;

    border-color: rgba(216,138,78,.25);
    border-left-color: #d88a4e;

    background:
        linear-gradient(
            90deg,
            rgba(184,104,55,.22),
            rgba(184,104,55,.025)
        );

    box-shadow:
        0 0 24px rgba(178,106,61,.08);
}

.boot-button.selected::before {
    content: "";

    position: absolute;

    left: -2px;
    top: 8px;
    bottom: 8px;

    width: 2px;

    background: #df9255;

    box-shadow:
        0 0 12px rgba(223,146,85,.8);
}

/* keyboard focus */

.boot-button:focus-visible {
    outline: 1px solid #c77e49;
    outline-offset: 3px;
}

/* =========================
   FOOTER
========================= */

.footer {
    margin-top: 30px;

    color: #444;

    font-size: 9px;
    letter-spacing: 1px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

    .interface {
        left: 6vw;
        width: 300px;
    }

    .jupiter {
        width: 540px;
        height: 540px;

        right: -310px;
    }

    .brand-name {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="space"></div>

<!-- =========================
     JUPITER
========================= -->

<div class="jupiter">

    <svg viewBox="0 0 800 800"
         xmlns="http://www.w3.org/2000/svg">

        <defs>

            <filter id="turbulence">
                <feTurbulence
                    type="fractalNoise"
                    baseFrequency="0.008 0.035"
                    numOctaves="4"
                    seed="17"
                    result="noise"/>

                <feDisplacementMap
                    in="SourceGraphic"
                    in2="noise"
                    scale="34"
                    xChannelSelector="R"
                    yChannelSelector="G"/>
            </filter>

            <radialGradient id="base"
                            cx="31%"
                            cy="32%"
                            r="72%">

                <stop offset="0%" stop-color="#d8b28d"/>
                <stop offset="38%" stop-color="#b47c5c"/>
                <stop offset="72%" stop-color="#85563f"/>
                <stop offset="100%" stop-color="#39251f"/>

            </radialGradient>

            <clipPath id="planetClip">
                <circle cx="400" cy="400" r="390"/>
            </clipPath>

        </defs>

        <circle
            cx="400"
            cy="400"
            r="390"
            fill="url(#base)"/>

        <g
            clip-path="url(#planetClip)"
            filter="url(#turbulence)">

            <path
                d="M-50 110 C180 65 290 155 480 105 C650 60 760 100 850 125 L850 185 C650 160 570 145 400 175 C220 205 100 160 -50 195Z"
                fill="#8b5c45"/>

            <path
                d="M-50 180 C130 135 270 220 455 180 C630 140 750 200 850 175 L850 255 C680 270 560 220 400 245 C220 275 100 225 -50 270Z"
                fill="#d2a27c"/>

            <path
                d="M-50 255 C120 220 270 285 430 255 C610 220 750 280 850 245 L850 335 C680 350 560 300 400 325 C220 350 100 305 -50 350Z"
                fill="#79503e"/>

            <path
                d="M-50 340 C130 300 250 375 430 340 C610 305 730 360 850 335 L850 425 C670 445 560 385 390 420 C210 450 100 395 -50 445Z"
                fill="#c89470"/>

            <path
                d="M-50 430 C130 390 260 470 440 430 C620 390 740 450 850 420 L850 515 C670 535 550 475 390 510 C210 545 100 485 -50 535Z"
                fill="#704839"/>

            <path
                d="M-50 520 C120 480 270 555 450 515 C620 480 750 535 850 505 L850 600 C680 620 550 565 390 595 C210 630 90 570 -50 625Z"
                fill="#c18a67"/>

            <path
                d="M-50 610 C140 570 270 645 450 605 C620 570 750 625 850 595 L850 690 C680 710 550 655 390 685 C210 720 100 665 -50 715Z"
                fill="#765040"/>

            <path
                d="M-50 700 C150 660 280 735 460 690 C620 660 740 710 850 685 L850 850 L-50 850Z"
                fill="#b77f60"/>

        </g>

    </svg>

    <div class="red-spot"></div>
    <div class="jupiter-shade"></div>
    <div class="jupiter-glow"></div>

</div>

<!-- =========================
     MENU
========================= -->

<main class="interface">

    <header>

        <div class="brand">

            <div class="planet-icon"></div>

            <div class="brand-name">
                Jupiter<span>Boot</span>
            </div>

        </div>

        <div class="device">
        </div>

    </header>

    <nav class="menu">

        <button class="boot-button selected"
                onclick="selectBoot(this, 'SYSTEM')">
            SYSTEM
        </button>

        <button class="boot-button"
                onclick="selectBoot(this, 'RECOVERY')">
            RECOVERY
        </button>

        <button class="boot-button"
                onclick="selectBoot(this, 'FASTBOOT')">
            FASTBOOT
        </button>

        <button class="boot-button"
                onclick="selectBoot(this, 'DOWNLOAD')">
            DOWNLOAD
        </button>

        <button class="boot-button"
                onclick="selectBoot(this, 'REBOOT')">
            REBOOT
        </button>

        <button class="boot-button"
                onclick="selectBoot(this, 'POWER OFF')">
            POWER OFF
        </button>

    </nav>

    <footer class="footer" id="footer">
        TOUCH TO SELECT · SYSTEM
    </footer>

</main>

<script>
function selectBoot(button, option) {

    document
        .querySelectorAll(".boot-button")
        .forEach(btn => btn.classList.remove("selected"));

    button.classList.add("selected");

    document.getElementById("footer").textContent =
        "TOUCH TO SELECT · " + option;
}

/* Keyboard navigation */

const buttons = [...document.querySelectorAll(".boot-button")];

let selected = 0;

document.addEventListener("keydown", event => {

    if (event.key === "ArrowDown") {
        selected = (selected + 1) % buttons.length;
        buttons[selected].click();
        buttons[selected].focus();
    }

    if (event.key === "ArrowUp") {
        selected = (selected - 1 + buttons.length) % buttons.length;
        buttons[selected].click();
        buttons[selected].focus();
    }

    if (event.key === "Enter") {
        buttons[selected].click();
    }

});
</script>

</body>
</html>
